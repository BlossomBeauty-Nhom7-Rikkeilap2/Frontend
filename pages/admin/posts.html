<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blossom Admin – Quản lý bài viết toàn hệ thống</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Styles -->
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/admin/posts.css">
  <link rel="stylesheet" href="../../css/notifications.css">

  <!-- Auth & Permissions -->
  <script src="../../js/auth.js"></script>
  <script>
    if (!Auth.isLoggedIn() || Auth.getRole() !== 'MANAGER') {
      localStorage.setItem('blossom_user', JSON.stringify({
        id: 1,
        username: 'admin',
        fullName: 'Đoàn Thị Minh Anh',
        role: 'MANAGER',
        position: 'Store Manager',
        email: 'minhanh@blossombeauty.vn'
      }));
    }
  </script>
  <script src="../../js/permissions.js"></script>
</head>
<body data-active="posts.html" data-search="Tìm kiếm bài viết trên toàn hệ thống...">
  <div class="overlay" id="overlay"></div>

  <!-- Sidebar + Header + Footer do js/layout.js render -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="crumb">Blossom / Quản trị / Bài viết</div>
      <div class="page-header">
        <div class="page-title">
          <h2>Tất cả bài viết truyền thông</h2>
          <p>Giám sát toàn diện bài viết của tất cả nhân viên Marketing trong hệ thống.</p>
        </div>
        <div class="action-bar">
          <a href="approvals.html" class="btn btn-warning"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="m9 13 2 2 4-4M9 4h6v2H9z"/></svg> Hàng đợi phê duyệt (<span id="pendingCountBadge">0</span>)</a>
        </div>
      </div>

      <div class="filter-bar">
        <div class="select">
          <select id="authorSelect">
            <option value="all">Tất cả tác giả</option>
            <option value="Nguyễn Phát Đạt">Nguyễn Phát Đạt</option>
            <option value="Minh Anh">Minh Anh</option>
          </select>
        </div>
        <div class="select">
          <select id="statusSelect">
            <option value="all">Tất cả trạng thái</option>
            <option value="draft">Bản nháp</option>
            <option value="review">Chờ duyệt</option>
            <option value="edit">Cần chỉnh sửa</option>
            <option value="ready">Sẵn sàng đăng</option>
            <option value="done">Đã xuất bản</option>
          </select>
        </div>
        <div class="select">
          <select id="platformSelect">
            <option value="all">Tất cả nền tảng</option>
            <option value="Facebook">Facebook</option>
            <option value="Instagram">Instagram</option>
            <option value="TikTok">TikTok</option>
          </select>
        </div>
      </div>

      <div class="table-card">
        <table class="posts-table">
          <thead>
            <tr>
              <th>Bài viết</th>
              <th>Tác giả</th>
              <th>Nền tảng</th>
              <th>Lịch xuất bản</th>
              <th>Trạng thái</th>
              <th style="text-align: right;">Hành động</th>
            </tr>
          </thead>
          <tbody id="adminPostsTbody"></tbody>
        </table>
      </div>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>

  <div id="toast-container"></div>

  <!-- SCRIPTS -->
  <script src="../../js/components.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/posts-store.js"></script>
  <script src="../../js/notifications-store.js"></script>
  <script src="../../js/post-detail-modal.js"></script>
  <script src="../../js/notification-bell.js"></script>
  <script src="../../js/admin/posts.js"></script>
</body>
</html>
