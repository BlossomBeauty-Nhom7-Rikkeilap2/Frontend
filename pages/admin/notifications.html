<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blossom Admin – Thông báo hệ thống (FR-12)</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS dùng chung & CSS trang -->
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/notifications.css">

    <!-- Kiểm tra đăng nhập + phân quyền -->
    <script src="../../js/auth.js"></script>
    <script>
      // Fallback phiên làm việc nếu mở trực tiếp không qua login
      if (!Auth.isLoggedIn() || Auth.getRole() !== 'MANAGER') {
        localStorage.setItem('blossom_user', JSON.stringify({
          id: 1,
          username: 'admin',
          fullName: 'Đoàn Thị Minh Anh',
          role: 'MANAGER',
          position: 'Store Manager',
          email: 'minhanh@blossombeauty.vn'
        }));
      }
    </script>
    <script src="../../js/permissions.js"></script>
</head>
<body data-active="notifications.html" data-search="Tìm kiếm thông báo...">
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar + Header + Footer do js/layout.js render -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content" style="padding: 32px;">
            <div class="crumb">Blossom / Quản trị / Thông báo hệ thống (FR-12)</div>

            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
                <div>
                    <h2 style="font-family: 'Playfair Display', serif; font-size: 26px; color: var(--text); font-weight: 700; margin-bottom: 4px;">Thông báo & Hoạt động toàn hệ thống</h2>
                    <p style="color: var(--muted); font-size: 14px;">Giám sát các yêu cầu duyệt bài từ Staff và hoạt động xuất bản đa kênh.</p>
                </div>
            </div>

            <!-- TOOLBAR & FILTERS -->
            <div class="notif-page-toolbar">
                <div class="notif-filter-tabs" id="notifFilterTabs">
                    <button type="button" class="notif-tab-btn active" data-filter="all">Tất cả thông báo</button>
                    <button type="button" class="notif-tab-btn" data-filter="unread">Chưa đọc (<span id="unreadCountBadge">0</span>)</button>
                    <button type="button" class="notif-tab-btn" data-filter="submitted">Yêu cầu duyệt bài 📋</button>
                    <button type="button" class="notif-tab-btn" data-filter="approved">Đã phê duyệt 🎉</button>
                    <button type="button" class="notif-tab-btn" data-filter="reminder">Nhắc xuất bản ⏰</button>
                </div>

                <div class="notif-actions-bar">
                    <button type="button" class="btn btn-outline btn-sm" id="btnMarkAllRead">
                        ✓ Đánh dấu tất cả đã đọc
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" id="btnClearRead">
                        🗑️ Xóa thông báo đã đọc
                    </button>
                </div>
            </div>

            <!-- NOTIFICATIONS LIST -->
            <div class="notif-list-container" id="notifListContainer">
                <!-- Rendered by JS -->
            </div>
        </main>

        <footer class="footer" id="footer"></footer>
    </div>

    <!-- SCRIPTS -->
    <script src="../../js/components.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/posts-store.js"></script>
    <script src="../../js/notifications-store.js"></script>
    <script src="../../js/post-detail-modal.js"></script>
    <script src="../../js/notification-bell.js"></script>
    <script src="../../js/staff/notifications.js"></script>
</body>
</html>
